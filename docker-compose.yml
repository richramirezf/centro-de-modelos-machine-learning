services:
  portal:
    build: .
    image: centro-ml:latest
    container_name: centro-ml-portal
    ports:
      - "8501:8501"
    environment:
      # Opcional: clave del asistente RAG. Sin ella, el asistente funciona en modo recuperación.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    restart: unless-stopped

  api:
    build: .
    image: centro-ml:latest
    container_name: centro-ml-api
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8600"]
    ports:
      - "8600:8600"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8600/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
